<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17332a"/>
      <stop offset="0.55" stop-color="#0f2a2a"/>
      <stop offset="1" stop-color="#101c2b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe3b4"/>
      <stop offset="0.6" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#9fb8ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="64" rx="28" fill="url(#glow)"/>
  <!-- the naught: a zero drawn as a ring with a gap, envelope-flap notch on top -->
  <circle cx="64" cy="66" r="30" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="150 40" transform="rotate(-125 64 66)"/>
  <circle cx="64" cy="66" r="9" fill="url(#ring)"/>
</svg>
